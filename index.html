<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Acessibilidade - Morse IoT</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

  <header>
    <h1>Acessibilidade Morse IoT</h1>
    <div id="status" class="status-card status-desconectado">Conectando Broker...</div>
  </header>

  <main class="card">
    <div class="label">Mensagem em Tempo Real (MQTT WebSocket)</div>
    <div id="displayTexto" class="display-texto">Aguardando sinais...</div>
  </main>

  <section class="card">
    <div class="header-tabela">
      <div class="label" style="margin: 0;">Histórico de Registros (API / Banco SQLite)</div>
      <button class="btn-atualizar" onclick="carregarHistoricoDoBanco()">Atualizar Tabela</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Evento</th>
          <th>Resultado</th>
          <th>Data / Hora</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        <tr>
          <td colspan="4" style="text-align: center; color: #888;">Carregando histórico do banco...</td>
        </tr>
      </tbody>
    </table>
  </section>

  <script>
    const API_URL = "http://" + (window.location.hostname || "192.168.137.138") + ":5000/api/historico";
    const MQTT_HOST = window.location.hostname || "192.168.137.138";
    const MQTT_PORT = 9001;

    // Conexão MQTT
    const client = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), "Web_" + Math.random().toString(16).substr(2, 8));

    client.onConnectionLost = () => {
      document.getElementById("status").innerText = "Desconectado";
      document.getElementById("status").className = "status-card status-desconectado";
    };

    client.onMessageArrived = (message) => {
      try {
        const payload = JSON.parse(message.payloadString);
        document.getElementById("displayTexto").innerText = payload.texto_completo || "(Texto vazio)";
        
        carregarHistoricoDoBanco();
      } catch (e) {
        console.error("Erro JSON MQTT:", e);
      }
    };

    client.connect({
      onSuccess: () => {
        document.getElementById("status").innerText = "Online (MQTT)";
        document.getElementById("status").className = "status-card status-conectado";
        client.subscribe("morse/texto");
      },
      onFailure: () => {
        document.getElementById("status").innerText = "Erro MQTT";
      }
    });

    async function carregarHistoricoDoBanco() {
      try {
        const resposta = await fetch(API_URL);
        const resultado = await resposta.json();

        if (resultado.status === "sucesso") {
          renderizarTabela(resultado.dados);
        }
      } catch (erro) {
        console.error("Erro ao conectar na API:", erro);
        document.getElementById("tabelaCorpo").innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: #e74c3c;">Falha ao carregar dados da API.</td>
          </tr>`;
      }
    }

    function renderizarTabela(dados) {
      const tbody = document.getElementById("tabelaCorpo");
      if (dados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Nenhum registro encontrado no banco.</td></tr>`;
        return;
      }

      tbody.innerHTML = dados.map(item => {
        let classeBadge = "badge-inserir";
        if (item.evento.includes("DELETAR")) classeBadge = "badge-deletar";
        if (item.evento.includes("ESPAÇO")) classeBadge = "badge-espaco";

        return `
          <tr>
            <td><strong>#${item.id}</strong></td>
            <td><span class="badge ${classeBadge}">${item.evento}</span></td>
            <td><code>${item.texto_resultado || "(vazio)"}</code></td>
            <td>${item.timestamp}</td>
          </tr>
        `;
      }).join('');
    }

    carregarHistoricoDoBanco();
  </script>
</body>
</html>
